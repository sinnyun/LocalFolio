# LocalFolio 工作台套件（产品安装入口）：
# 把基础能力与框架桥接插件合装成一个可安装的工作台。
# 插件之间只通过 Cordis 服务（folioStorage / folioRuntime / folioUi / folioShell / folioFrame）与 DSH Slot 协作。
#
# 这里刻意不含任何 test-* 插件：验证界面单独在 @folio/test-suite，按需另装。
- insert:
    - id: base-storage-host
      name: '@folio/base-storage-host'
    - id: base-runtime-host
      name: '@folio/base-runtime-host'
    - id: base-ui-kit
      name: '@folio/base-ui-kit'
    - id: base-shell-ui
      name: '@folio/base-shell-ui'
    - id: bridge-dsh-interactions-ui
      name: '@folio/bridge-dsh-interactions-ui'
    - id: base-frame-ui
      name: '@folio/base-frame-ui'
    - id: base-settings-ui
      name: '@folio/base-settings-ui'
    - id: bridge-frame-test-ui
      name: '@folio/bridge-frame-test-ui'
    - id: workspace-files-host
      name: '@folio/workspace-files-host'
    - id: workspace-files-ui
      name: '@folio/workspace-files-ui'
    - id: workspace-canvas-host
      name: '@folio/workspace-canvas-host'
    - id: workspace-canvas-ui
      name: '@folio/workspace-canvas-ui'
