# LocalFolio 工作台套件：
# 把独立 @folio/* DSH 插件合装成一个可安装的工作台。
# 插件之间只通过 Cordis 服务（folioStorage / folioRuntime / folioUi / folioShell / folioFrame）与 DSH Slot 协作。
- insert:
    - id: base-storage-host
      name: '@folio/base-storage-host'
    - id: base-runtime-host
      name: '@folio/base-runtime-host'
    - id: base-ui-kit
      name: '@folio/base-ui-kit'
    - id: base-shell-ui
      name: '@folio/base-shell-ui'
    - id: base-frame-ui
      name: '@folio/base-frame-ui'
    - id: base-settings-ui
      name: '@folio/base-settings-ui'
    - id: bridge-frame-test-ui
      name: '@folio/bridge-frame-test-ui'
    - id: test-overview-host
      name: '@folio/test-overview-host'
    - id: test-overview-ui
      name: '@folio/test-overview-ui'
    - id: test-gallery-ui
      name: '@folio/test-gallery-ui'
    - id: test-sidebar-ui
      name: '@folio/test-sidebar-ui'
    - id: test-shadcn-admin-ui
      name: '@folio/test-shadcn-admin-ui'
    - id: test-studio-admin-ui
      name: '@folio/test-studio-admin-ui'
